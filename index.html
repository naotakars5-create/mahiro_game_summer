<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レゴあつめ＆まちづくりゲーム 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== タイトルがめん ====== -->
  <div id="title-screen" class="screen">
    <h1>🧱 レゴあつめ<br>＆ まちづくり 3D 🏙️</h1>
    <p class="sub">ブロックをあつめて、いえや ビル、おみせ、くるまを つくろう！</p>
    <button id="start-btn" class="big-btn">スタート ▶</button>
    <div class="howto">
      <h2>あそびかた</h2>
      <ol>
        <li>やじるしキー（or したの ボタン）で うごく</li>
        <li>まちの ブロックに ふれると あつまるよ</li>
        <li>「いえ」「ビル」「おみせ」「くるま」ボタンで たてる ばしょを えらんで「たてる」を おそう</li>
        <li>たてもののドアに ちかづくと、なかに 入れるよ（お店には 店員さんも いるよ）</li>
        <li>「おもちゃ」ボタンで じぶんだけの さくひんを つくれるよ</li>
        <li>「こうげき」ボタンで パンチ！どうぶつが びっくりして にげるよ</li>
      </ol>
    </div>
  </div>

  <!-- ====== ゲームがめん（まち／たてものの なか） ====== -->
  <div id="game-screen" class="screen hidden">
    <div class="topbar">
      <div id="inventory" class="inventory"></div>
      <div class="topbar-buttons">
        <button id="sound-btn" class="mini-btn">🔊</button>
        <button id="attack-btn" class="mini-btn">🤜 こうげき</button>
        <button id="build-house-btn" class="mini-btn build-trigger">🏠 いえ</button>
        <button id="build-building-btn" class="mini-btn build-trigger">🏢 ビル</button>
        <button id="build-shop-btn" class="mini-btn build-trigger">🏪 おみせ</button>
        <button id="build-car-btn" class="mini-btn build-trigger">🚗 くるま</button>
        <button id="build-toy-btn" class="mini-btn build-trigger">🧸 おもちゃ</button>
        <button id="exit-house-btn" class="mini-btn hidden">◀ そとに でる</button>
        <button id="exit-car-btn" class="mini-btn hidden">🚪 くるまを おりる</button>
        <button id="confirm-place-btn" class="mini-btn hidden">✅ ここに たてる</button>
        <button id="done-toy-btn" class="mini-btn hidden">👍 できた！</button>
        <button id="cancel-place-btn" class="mini-btn danger hidden">✖ やめる</button>
      </div>
    </div>
    <div id="toy-palette" class="inventory hidden"></div>
    <div id="game-message"></div>
    <div class="canvas-stage">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="touch-controls">
      <button id="btn-up" class="dpad">⬆</button>
      <div class="dpad-row">
        <button id="btn-left" class="dpad">⬅</button>
        <button id="btn-down" class="dpad">⬇</button>
        <button id="btn-right" class="dpad">➡</button>
      </div>
    </div>
  </div>

<script src="three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
